name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'maven'
        server-id: github
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
    
    - name: Extract version from pom.xml
      id: version
      run: |
        VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Build and publish release
      run: ./mvnw --batch-mode clean deploy -DskipTests
      env:
        MAVEN_USERNAME: ${{ github.actor }}
        MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Commit version change
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pom.xml
        git commit -m "Release version ${{ steps.version.outputs.version }}"
        git tag v${{ steps.version.outputs.version }}
        git push origin main
        git push origin v${{ steps.version.outputs.version }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
    
    - name: Revert to SNAPSHOT version
      run: ./mvnw versions:set -DnextVersion=${{ steps.version.outputs.version }}-SNAPSHOT
    
    - name: Commit SNAPSHOT version
      run: |
        git add pom.xml
        git commit -m "Revert to SNAPSHOT version"
        git push origin main
